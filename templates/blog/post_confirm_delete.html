{% extends 'base.html' %}

{% block title %}Eliminar Publicación | El Blog de Michi{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card card-custom p-4 text-center">
            <div class="display-3 text-danger mb-3">
                <i class="bi bi-exclamation-triangle"></i>
            </div>
            
            <h2 class="h4 fw-bold text-dark mb-3">¿Confirmas la eliminación?</h2>
            
            <p class="text-secondary mb-4">
                Estás a punto de borrar la publicación <strong>"{{ post.titulo }}"</strong>. Esta acción no se puede deshacer.
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'blog:detalle_post' post.pk %}" class="btn btn-secondary px-4">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash"></i> Sí, eliminar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
